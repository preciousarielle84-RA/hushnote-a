<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HushNote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { 
      background: linear-gradient(180deg, #8a1282 0%, #e91e63 100%); 
      min-height: 100vh; 
      color: white; 
      text-align: center; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    }
    .container { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .header { font-size: 2.8rem; font-weight: 900; font-style: italic; margin-bottom: 20px; letter-spacing: 1px; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .subtitle { font-size: 1.25rem; font-weight: 800; line-height: 1.4; margin-bottom: 35px; color: white; }
    .main-get-btn { 
      background: white; 
      color: #8a1282; 
      border: none; 
      padding: 18px 30px; 
      border-radius: 40px; 
      font-weight: 900; 
      font-size: 1.15rem; 
      width: 100%; 
      cursor: pointer; 
      box-shadow: 0 6px 20px rgba(0,0,0,0.2); 
    }
    .terms-text { font-size: 0.75rem; opacity: 0.85; margin-top: 25px; font-weight: 600; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">HUSHNOTE</div>
    <div class="subtitle">
      Recevez des messages anonymes sur vos réseaux ! 💬 <br>✨
    </div>
    <button onclick="alert('Page d\'accueil validée !')" class="main-get-btn">
      Obtenir des questions 🚀
    </button>
    <div class="terms-text">
      En continuant, vous acceptez nos Conditions d'utilisation.
    </div>
  </div>

</body>
</html>
