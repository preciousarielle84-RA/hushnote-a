<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hushnote - Questions Anonymes</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .app-card { 
            width: 100%; 
            max-width: 400px; 
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            padding: 25px; 
            border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }
        .logo { font-size: 2.2rem; font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.2); margin-bottom: 5px; }
        .subtitle { color: #fff; font-size: 0.95rem; font-weight: 600; opacity: 0.9; margin-bottom: 25px; }
        .box-container {
            background: #fff;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, textarea { 
            width: 100%; 
            border: none; 
            outline: none; 
            background: transparent; 
            font-size: 1rem; 
            color: #222;
        }
        input { font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        textarea { resize: none; height: 80px; font-weight: 500; }
        .send-btn { 
            width: 100%; 
            background: #000; 
            color: #fff; 
            font-size: 1.1rem; 
            font-weight: 800; 
            padding: 16px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: transform 0.1s ease;
        }
        .send-btn:active { transform: scale(0.98); }
        .notes-header { color: #fff; font-weight: 800; font-size: 1.1rem; margin: 25px 0 12px; text-align: left; }
        .notes-list { display: flex; flex-direction: column; gap: 12px; }
        .note-card { 
            background: #fff; 
            padding: 16px; 
            border-radius: 18px; 
            text-align: left; 
            position: relative; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08); 
        }
        .note-card h3 { font-size: 1rem; color: #ff0844; margin-bottom: 4px; font-weight: 800; }
        .note-card p { font-size: 0.95rem; color: #333; font-weight: 600; line-height: 1.3; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #ccc; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-card">
        <div class="logo">🤫 Hushnote</div>
        <div class="subtitle">Recevez des messages & questions anonymes !</div>

        <div class="box-container">
            <input type="text" id="noteTitle" placeholder="Pose-moi une question..." />
            <textarea id="noteContent" placeholder="Écris ton message anonyme ici..."></textarea>
        </div>

        <button class="send-btn" onclick="addNote()">Envoyer en anonyme 🚀</button>

        <div class="notes-header">Boîte de réception 📬</div>
        <div class="notes-list" id="notesList">
            <p style="color:#fff; opacity:0.8;">Chargement...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://tieptbsrgbshpixsgrht.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpZXB0YnNyZ2JzaHBpeHNncmh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAxNTIxOTIsImV4cCI6MjA3NTcyODE5Mn0.S_yvL2qImsa0iN-P5Z492_K65Yj6U5Wp3fC-707V2g8";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchNotes() {
            const listEl = document.getElementById('notesList');
            const { data, error } = await supabase.from('notes').select('*').order('created_at', { ascending: false });
            
            if (error) {
                listEl.innerHTML = `<p style="color:#fff;">Erreur de chargement</p>`;
                return;
            }
            if (!data || data.length === 0) {
                listEl.innerHTML = '<p style="color:#fff; opacity:0.8; font-size:0.9rem;">Aucun message reçu pour le moment.</p>';
                return;
            }
            listEl.innerHTML = data.map(n => `
                <div class="note-card">
                    <h3>${escapeHtml(n.title || 'Message anonyme')}</h3>
                    <p>${escapeHtml(n.content || '')}</p>
                    <button class="delete-btn" onclick="deleteNote('${n.id}')">✕</button>
                </div>
            `).join('');
        }

        async function addNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            if (!content) return alert('Écris un message avant d\'envoyer !');

            const { error } = await supabase.from('notes').insert([{ title, content }]);
            if (error) {
                alert('Erreur : ' + error.message);
            } else {
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                fetchNotes();
            }
        }

        async function deleteNote(id) {
            const { error } = await supabase.from('notes').delete().eq('id', id);
            if (!error) fetchNotes();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = fetchNotes;
    </script>
</body>
</html>
