<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HushNote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(180deg, #8a1282 0%, #e91e63 100%); min-height: 100vh; color: white; text-align: center; padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .header { font-size: 2.8rem; font-weight: 900; font-style: italic; margin-bottom: 20px; letter-spacing: 1px; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .subtitle { font-size: 1.25rem; font-weight: 800; line-height: 1.4; margin-bottom: 35px; max-width: 320px; color: white; }
    .main-get-btn { background: white; color: #8a1282; border: none; padding: 18px 30px; border-radius: 40px; font-weight: 900; font-size: 1.15rem; width: 100%; max-width: 340px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    .terms-text { font-size: 0.75rem; opacity: 0.85; margin-top: 25px; font-weight: 600; color: white; }
    
    .card { background: white; color: #333; padding: 25px 20px; border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); margin-bottom: 20px; text-align: center; width: 100%; max-width: 350px; }
    .input-field { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 12px; font-size: 1rem; margin-bottom: 12px; }
    .action-btn { width: 100%; padding: 14px; background: linear-gradient(90deg, #ff4081, #e91e63); color: white; border: none; border-radius: 25px; font-weight: 800; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(233,30,99,0.3); }
    .container { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. PAGE D'ACCUEIL SEULE -->
    <div id="homeLandingSection" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="header">HUSHNOTE</div>
      <div class="subtitle">
        Recevez des messages anonymes sur vos réseaux ! 💬 ✨
      </div>
      <button onclick="showSendForm()" class="main-get-btn">
        Obtenir des questions 🚀
      </button>
      <div class="terms-text">
        En continuant, vous acceptez nos Conditions d'utilisation.
      </div>
    </div>

    <!-- 2. PAGE D'ENVOI DE MESSAGE (CACHÉE AU DÉPART) -->
    <div id="sendMsgSection" style="display: none; width: 100%;">
      <div class="header">HUSHNOTE</div>
      <div class="card">
        <h3 style="margin-bottom: 12px; color: #8a1282;" id="targetUserTitle">Envoyez un message anonyme 🤫</h3>
        <textarea id="anonymousInput" rows="4" placeholder="Écris ton message anonyme ici..." class="input-field" style="resize: none;"></textarea>
        <input type="text" id="senderHintInput" placeholder="Ton prénom ou un indice (optionnel)" class="input-field">
        <button onclick="sendAnonymousMessage()" class="action-btn">Envoyer le message 🚀</button>
      </div>
      <div>
        <a href="#" style="color: white; font-weight: 700; text-decoration: underline;" onclick="showHomeLanding()">← Retour à l'accueil</a>
      </div>
    </div>

  </div>

  <script>
    function showHomeLanding() {
      document.getElementById("homeLandingSection").style.display = "flex";
      document.getElementById("sendMsgSection").style.display = "none";
    }

    function showSendForm() {
      document.getElementById("homeLandingSection").style.display = "none";
      document.getElementById("sendMsgSection").style.display = "block";
    }

    function sendAnonymousMessage() {
      const input = document.getElementById("anonymousInput");
      const text = input.value.trim();
      if (!text) {
        alert("Veuillez écrire un message avant d'envoyer.");
        return;
      }
      alert("Message envoyé anonymement ! 🚀");
      input.value = "";
      if (document.getElementById("senderHintInput")) document.getElementById("senderHintInput").value = "";
    }
  </script>
</body>
</html>
